name: laburito
description: Plataforma geolocalizada que conecta Buscadores con Profesionales de oficios.
publish_to: 'none'
version: 0.1.0+1

environment:
  # Flutter 3.27 es el piso real: antes de esa versión no existe
  # Color.withValues. Declararlo hace que un SDK viejo falle en `pub get`
  # con un mensaje claro, en vez de dejar errores raros en el editor.
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
