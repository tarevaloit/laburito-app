name: laburito
description: Plataforma geolocalizada que conecta Buscadores con Profesionales de oficios.
publish_to: 'none'
version: 0.2.0+2

environment:
  # Flutter 3.27 es el piso real: antes de esa versión no existe
  # Color.withValues. Declararlo hace que un SDK viejo falle en `pub get`
  # con un mensaje claro, en vez de dejar errores raros en el editor.
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0

  # Anotaciones del codegen. Van en `dependencies` y no en `dev_`: el código
  # generado las importa en tiempo de ejecución.
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.1.0

  # CU-16 — mapa. `google_maps_flutter_web` no viene endosado por el paquete
  # principal: hay que declararlo a mano o la Web compila y muestra un hueco.
  google_maps_flutter: ^2.18.0
  google_maps_flutter_web: ^0.6.3

  # Posición del dispositivo y permisos, con un solo camino de código para Web
  # (Geolocation del navegador) y Android.
  geolocator: ^14.0.3

  # Cliente HTTP. Lo usan los servicios de Places y de geocodificación inversa
  # del CU-16, y `package:http/testing.dart` en las pruebas del repositorio.
  # Pasó de `dev_dependencies` a acá cuando dejó de ser solo de tests.
  http: ^1.6.0

  # DOM del navegador. Solo lo importa `lib/core/mapas/sdk_mapas_web.dart`, que
  # inyecta el `<script>` de Maps con la clave del `--dart-define` en vez de
  # dejarla escrita en `web/index.html`.
  web: ^1.1.1

  # CU-21 — notificaciones push. `lib/firebase_options.dart` y los archivos de
  # configuración nativa (`android/app/google-services.json`,
  # `ios/Runner/GoogleService-Info.plist`) los genera `flutterfire configure`
  # contra el proyecto real de Firebase; los tres están en el `.gitignore`
  # porque identifican el proyecto (ver docs/FIREBASE.md). Quien clone el
  # repo en otra máquina tiene que correr el Paso 1 y 2 de esa guía antes de
  # poder compilar: sin esos archivos, `lib/main.dart` no resuelve el import.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generadores. Después de tocar un modelo o un provider:
  #   dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.3
  freezed: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    # El logotipo de la marca. Ver assets/logo/README.md: mientras el PNG no
    # esté, la app dibuja un logo de reserva y compila igual.
    - assets/logo/
